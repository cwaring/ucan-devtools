name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: cwaring/ucan-devtools/.github/actions/setup-js@main

      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: cwaring/ucan-devtools/.github/actions/setup-js@main
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm test
      - run: pnpm "/^build:?/"
