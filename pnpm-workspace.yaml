catalogs:
  cli:
    '@antfu/eslint-config': ^9.0.0
    '@antfu/ni': ^30.1.0
    bumpp: ^11.1.0
    eslint: ^10.4.0
    lint-staged: ^17.0.5
    publint: ^0.3.21
    simple-git-hooks: ^2.13.1
    typescript: ^6.0.3
  dev:
    '@tailwindcss/vite': ^4.3.0
    '@vitejs/plugin-vue': ^6.0.7
    '@wxt-dev/auto-icons': ^1.1.1
    '@wxt-dev/module-vue': ^1.0.3
    tailwindcss: ^4.3.0
    tw-animate-css: ^1.4.0
    vite: ^8.0.13
    vue-tsc: ^3.3.1
    wxt: ^0.20.26
  frontend:
    '@lucide/vue': ^1.16.0
    '@vueuse/core': ^14.3.0
    cborg: ^5.1.1
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    pako: ^2.1.0
    reka-ui: ^2.9.7
    tailwind-merge: ^3.6.0
    vue: ^3.5.34
  testing:
    tinyexec: ^1.1.2
